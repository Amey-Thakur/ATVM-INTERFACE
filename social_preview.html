<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATVM Interface - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;background:#003399;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;
  background:radial-gradient(1100px 620px at 20% 10%,rgba(255,255,255,.14),transparent 60%)}
.ticket{position:absolute;left:56px;top:56px;width:1168px;height:528px;background:#FBF8F1;
        border-radius:10px;box-shadow:0 26px 60px rgba(0,0,0,.34);overflow:hidden;display:flex}
.lines{position:absolute;left:0;right:0;top:0;height:12px;display:flex}
.lines i{flex:1}
.main{flex:1;padding:56px 52px 44px}
.hd{display:flex;align-items:center;gap:20px}
.hd img{width:74px;height:74px;object-fit:contain}
.nm{font-size:29px;font-weight:700;color:#0B2C6B;letter-spacing:.01em;line-height:1.25}
.nm span{display:block;font-size:20px;font-weight:600;color:#4a5a7a;margin-top:3px}
.rule{height:2px;background:repeating-linear-gradient(90deg,#c9ccd6 0 9px,transparent 9px 17px);margin:32px 0 30px}
.k{font-size:14px;font-weight:700;letter-spacing:.20em;color:#7b8296}
.journey{display:flex;align-items:flex-end;gap:30px}
.st{font-size:52px;font-weight:800;color:#12203d;letter-spacing:-.01em;line-height:1.05}
.st small{display:block;font-size:19px;font-weight:600;color:#5c6880;letter-spacing:0;margin-top:5px}
.arrow{font-size:44px;color:#E31E24;font-weight:800;padding-bottom:26px}
.grid{display:flex;gap:60px;margin-top:38px}
.f .v{font-size:30px;font-weight:800;color:#12203d;margin-top:8px}
.f .v.fare{color:#E31E24}
.foot{margin-top:40px;font-size:16px;font-weight:600;letter-spacing:.10em;color:#8a91a3}
.stub{width:322px;border-left:3px dashed #c2c6d2;padding:56px 40px 44px;
      display:flex;flex-direction:column;justify-content:space-between;background:#F5F1E7}
.tag{font-size:14px;font-weight:700;letter-spacing:.20em;color:#7b8296}
.title{font-size:54px;font-weight:800;color:#0B2C6B;line-height:1.02;letter-spacing:-.015em;margin-top:14px}
.stack{margin-top:16px;font-size:17px;font-weight:700;letter-spacing:.10em;color:#E31E24}
.by{font-size:20px;font-weight:700;color:#12203d;line-height:1.55}
.by span{display:block;font-size:14px;font-weight:600;letter-spacing:.14em;color:#7b8296;margin-bottom:8px}
</style>
<div class="card">
  <div class="ticket">
    <div class="lines"><i style="background:#003399"></i><i style="background:#E31E24"></i><i style="background:#9B59B6"></i><i style="background:#8BC53E"></i></div>
    <div class="main">
      <div class="hd"><img src="Source%20Code/images/mumbai_modern_monogram_logo.png" alt="">
        <div class="nm">MUMBAI SUBURBAN RAILWAY<span>मुंबई उपनगरीय रेल्वे</span></div></div>
      <div class="rule"></div>
      <div class="journey">
        <div><div class="k">FROM</div><div class="st">THANE<small>ठाणे</small></div></div>
        <div class="arrow">&#10230;</div>
        <div><div class="k">TO</div><div class="st">MUMBAI CSMT<small>मुंबई सीएसएमटी</small></div></div>
      </div>
      <div class="grid">
        <div class="f"><div class="k">TYPE</div><div class="v">SINGLE</div></div>
        <div class="f"><div class="k">CLASS</div><div class="v">SECOND</div></div>
        <div class="f"><div class="k">ADULT</div><div class="v">1</div></div>
        <div class="f"><div class="k">TOTAL FARE</div><div class="v fare">&#8377; 15</div></div>
      </div>
      <div class="foot">UNRESERVED TICKETING SYSTEM &nbsp;&middot;&nbsp; अनारक्षित तिकीट प्रणाली</div>
    </div>
    <div class="stub">
      <div>
        <div class="tag">PROJECT</div>
        <div class="title">ATVM<br>Interface</div>
        <div class="stack">ANGULARJS &middot; 2022</div>
      </div>
      <div class="by"><span>DESIGNED &amp; DEVELOPED BY</span>Amey Thakur<br>Mega Satish</div>
    </div>
  </div>
</div>
</body>
</html>
